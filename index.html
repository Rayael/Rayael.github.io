<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace d'Apprentissage & Exercices</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Structure du menu neutre */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    #main-portal {
      text-align: center;
      padding: 20px;
    }

    /* Bouton principal pour le français */
    .btn-french {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      font-size: 1.1rem;
      color: #ffffff;
      background-color: #2c3e50;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-french:hover {
      background-color: #34495e;
    }

    /* Bouton secret discret */
    .secret-trigger {
      position: fixed;
      bottom: 15px;
      right: 15px;
      opacity: 0.2;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.3s;
    }

    .secret-trigger:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Menu Neutre -->
  <div id="main-portal">
    <h1>Plateforme d'Exercices de Français</h1>
    <p>Bienvenue ! Cliquez ci-dessous pour accéder aux cours et exercices.</p>

    <!-- Redirection vers les exercices de français -->
    <a href="index_fr.html" class="btn-french">
      Accéder aux Exercices de Français 📖
    </a>
  </div>

  <!-- Bouton secret qui redirige vers index_love.html -->
  <a href="index_love.html" class="secret-trigger" title="?">❤️</a>

</body>
</html>
